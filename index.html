<style>
  :root{
    --bg:#000000; --surface:#141416; --surface-alt:#1E1E21; --border:#2A2A2E;
    --text:#FFFFFF; --muted:#8E8E93;
    --p1:#33E0C7; --p1-dim:#132E29;
    --p2:#FFA94D; --p2-dim:#332413;
    --success:#32D74B; --danger:#FF6961; --warn:#FFD426; --info:#64B5F6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display',system-ui,'Segoe UI',sans-serif;}
  h1,h2,h3,.display{font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;letter-spacing:-0.02em;}
  .mono{font-family:Arial, Helvetica, sans-serif;}
  a{color:inherit;}

  #app{max-width:600px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);}
  .brand-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px 20px;}
  .brand-header .display{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin:0;}
  .brand-header .display span{color:var(--p1);}

  #main{padding:8px 18px 100px 18px;}
  .page-title{font-size:28px;font-weight:700;margin:8px 0 2px 0;letter-spacing:-0.02em;}
  .page-sub{color:var(--muted);font-size:14px;margin:0 0 24px 0;line-height:1.4;}

  /* Bottom tab bar */
  #bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:600px;background:rgba(20,20,22,0.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom, 0);}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 2px 8px 2px;color:var(--muted);cursor:pointer;font-size:10px;font-weight:600;}
  .tab-item .tab-icon{font-size:20px;line-height:1;opacity:.7;}
  .tab-item.active{color:var(--text);}
  .tab-item.active .tab-icon{opacity:1;filter:drop-shadow(0 0 8px var(--p1));}

  .more-sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99;display:flex;align-items:flex-end;justify-content:center;}
  .more-sheet{max-width:600px;width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 10px 24px 10px;}
  .more-sheet .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:6px auto 14px auto;}
  .more-sheet .sheet-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;}
  .more-sheet .sheet-item:active{background:var(--surface-alt);}
  .more-sheet .sheet-item .tab-icon{font-size:18px;width:24px;text-align:center;}

  /* Rings */
  .ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
  .ring-center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-center .ring-val{font-family:Arial,Helvetica,sans-serif;font-weight:800;line-height:1;}
  .ring-center .ring-lbl{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

  .sync-split{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
  .sync-half{background:var(--surface);border-radius:20px;padding:18px 20px;cursor:pointer;}
  .sync-half.p1{box-shadow:inset 3px 0 0 var(--p1);}
  .sync-half.p2{box-shadow:inset 3px 0 0 var(--p2);}
  .sync-name{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;}
  .sync-name .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
  .p1 .dot{background:var(--p1);} .p2 .dot{background:var(--p2);}
  .sync-body{display:flex;align-items:center;gap:18px;}
  .sync-metrics{display:flex;gap:18px;flex-wrap:wrap;flex:1;}
  .sync-metric .val{font-size:20px;font-weight:700;font-family:Arial, Helvetica, sans-serif;}
  .sync-metric .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .trend-up{color:var(--danger);} .trend-down{color:var(--success);} .trend-flat{color:var(--muted);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{background:var(--surface);border-radius:20px;padding:18px 20px;margin-bottom:14px;}
  .card h3{margin:0 0 14px 0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card h3 .dot{width:8px;height:8px;border-radius:50%;}
  .card .hint{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.4;}

  label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;margin-top:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  label:first-child{margin-top:0;}
  input,select{width:100%;background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;padding:11px 12px;color:var(--text);font-size:15px;font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--p1);}
  input:disabled,select:disabled{opacity:0.5;cursor:not-allowed;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  button{background:var(--p1);color:#00110E;border:none;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:opacity .15s, transform .1s;}
  button:active{transform:scale(0.97);}
  button:hover{opacity:.88;}
  button.secondary{background:var(--surface-alt);color:var(--text);}
  button.small{padding:8px 14px;font-size:12px;}
  .btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}

  .person-toggle{display:flex;gap:8px;margin-bottom:20px;background:var(--surface-alt);padding:4px;border-radius:999px;}
  .person-toggle button{background:transparent;color:var(--muted);flex:1;padding:9px;border-radius:999px;}
  .person-toggle button.active.p1{background:var(--p1);color:#00110E;}
  .person-toggle button.active.p2{background:var(--p2);color:#2B1600;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);font-family:Arial, Helvetica, sans-serif;}
  tr:last-child td{border-bottom:none;}
  .del-x{cursor:pointer;color:var(--muted);}
  .del-x:hover{color:var(--danger);}

  .macro-bar-wrap{margin-top:10px;}
  .macro-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .macro-bar-bg{height:8px;background:var(--surface-alt);border-radius:4px;overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:4px;}
  .ring-row{display:flex;justify-content:space-around;text-align:center;margin-top:6px;}
  .ring-row .ring-item .ring-item-lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:8px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
  .badge.pr{background:var(--p2-dim);color:var(--p2);}
  .badge.phase-cut{background:#3B1E1E;color:var(--danger);}
  .badge.phase-recomp{background:#152A38;color:var(--info);}
  .badge.phase-leanBulk{background:var(--p1-dim);color:var(--p1);}
  .badge.home{background:var(--p2-dim);color:var(--p2);}
  .badge.rest{background:var(--surface-alt);color:var(--muted);}

  canvas{max-height:240px;}
  .empty-state{color:var(--muted);font-size:13px;padding:24px 16px;text-align:center;border-radius:16px;background:var(--surface-alt);}
  .set-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .set-row input{width:80px;}
  .set-row span{color:var(--muted);font-size:12px;}

  /* Program calendar */
  .week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;}
  .day-col{background:var(--surface-alt);border-radius:16px;padding:14px;min-height:70px;}
  .day-col .day-name{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
  .day-col .day-date{font-size:14px;font-weight:700;margin-bottom:8px;}
  .day-col.today{box-shadow:0 0 0 2px var(--p1) inset;}
  .session-plan{margin-top:10px;font-size:12px;}
  .session-plan .ex-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);gap:8px;}
  .session-plan .ex-row:last-child{border-bottom:none;}
  .session-plan .ex-name{color:var(--text);}
  .session-plan .ex-scheme{color:var(--muted);font-family:Arial, Helvetica, sans-serif;font-size:11px;text-align:right;}
  .progress-summary{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .progress-chip{background:var(--surface-alt);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--muted);}
  .progress-chip strong{color:var(--text);}
  .session-bubble{cursor:pointer;padding:10px 12px;border-radius:14px;font-size:12px;font-weight:700;margin-top:8px;border:2px solid transparent;text-align:center;transition:transform .1s;}
  .session-bubble:active{transform:scale(0.97);}
  .session-bubble.selected{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn) inset;}
  .session-bubble.home{background:var(--p2-dim);color:var(--p2);}
  .empty-day-slot{padding:10px;text-align:center;color:var(--muted);font-size:11px;border:1.5px dashed var(--border);border-radius:14px;margin-top:8px;cursor:pointer;}
  .empty-day-slot:hover{border-color:var(--p1);color:var(--text);}

  /* Vertical training calendar (Runna-style) */
  .cal-week-head{display:flex;justify-content:space-between;align-items:flex-start;margin:18px 0 10px 0;gap:10px;}
  .cal-week-range{font-size:16px;font-weight:700;}
  .cal-week-badge{background:var(--surface-alt);color:var(--muted);font-size:10px;padding:3px 9px;border-radius:999px;margin-left:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .cal-day-row{display:flex;align-items:stretch;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .cal-day-row:last-child{border-bottom:none;}
  .cal-date-col{width:42px;flex-shrink:0;text-align:center;padding-top:6px;cursor:pointer;}
  .cal-date-col .cal-day-abbr{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .cal-date-col .cal-day-num{font-size:15px;font-weight:700;margin-top:4px;}
  .cal-date-col.today .cal-day-num{background:var(--p1);color:#00110E;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin:4px auto 0 auto;}
  .cal-day-body{flex:1;display:flex;align-items:stretch;gap:8px;min-width:0;}
  .cal-bar{width:4px;border-radius:4px;flex-shrink:0;}
  .cal-content{flex:1;padding:9px 12px;border-radius:14px;background:var(--surface-alt);cursor:pointer;min-width:0;}
  .cal-content .cal-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .cal-content .cal-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .cal-move-btn{flex-shrink:0;align-self:center;width:34px;height:34px;border-radius:50%;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--muted);}
  .cal-move-btn.selected{background:var(--warn);color:#000;}
  .cal-add-row{flex:1;display:flex;align-items:center;padding:11px 14px;border-radius:14px;border:1.5px dashed var(--border);color:var(--muted);font-size:13px;cursor:pointer;}
  .cal-add-row:active{border-color:var(--p1);}
  .cal-expanded{padding:6px 0 10px 52px;}
  .cal-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;align-self:center;position:relative;}
  .cal-check.checked{background:var(--success);border-color:var(--success);}
  .cal-check.checked::after{content:'✓';color:#00110E;font-size:13px;font-weight:900;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .cal-week-dots{display:flex;gap:6px;}
  .cal-week-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);background:var(--surface-alt);flex-shrink:0;}
  .cal-week-dot.scheduled{background:var(--surface-alt);border:2px solid var(--warn);color:var(--warn);}
  .cal-week-dot.done{background:var(--success);border:2px solid var(--success);color:#00110E;}
  .cal-week-dot.today{box-shadow:0 0 0 2px var(--p1);}
  .cal-activity-row{padding:6px 0 2px 0;font-size:12px;}
  .cal-add-activity-btn{color:var(--muted);cursor:pointer;font-weight:400;font-size:11px;opacity:0.7;}
  .cal-add-activity-btn:hover{opacity:1;}
  .cal-activity-row .del-x{margin-left:8px;font-size:11px;}

  /* Meal Prep: day timeline (Vora/Plan-to-Eat style) */
  .meal-timeline{position:relative;padding-left:26px;}
  .meal-timeline::before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--border);}
  .meal-node{position:relative;margin-bottom:20px;}
  .meal-node:last-child{margin-bottom:0;}
  .meal-check{position:absolute;left:-26px;top:1px;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;background:var(--bg);}
  .meal-check.checked{background:var(--success);border-color:var(--success);position:relative;}
  .meal-check.checked::after{content:'✓';color:#00110E;font-size:11px;font-weight:900;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .meal-header{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px;}
  .meal-header .meal-cals{color:var(--muted);font-weight:600;font-size:12px;}
  .meal-item-row{display:flex;align-items:center;gap:10px;background:var(--surface-alt);border-radius:14px;padding:10px 12px;margin-top:8px;cursor:pointer;}
  .meal-item-icon{font-size:22px;flex-shrink:0;width:28px;text-align:center;}
  .meal-item-info{flex:1;min-width:0;}
  .meal-item-name{font-size:13px;font-weight:700;}
  .meal-item-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:Arial,Helvetica,sans-serif;}
  .meal-item-more{color:var(--muted);font-size:18px;padding:2px 6px;flex-shrink:0;}

  /* Grocery checklist */
  .grocery-cat-header{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 8px 4px;cursor:pointer;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
  .grocery-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);}
  .grocery-row:last-child{border-bottom:none;}
  .grocery-icon{font-size:20px;width:26px;text-align:center;flex-shrink:0;}
  .grocery-info{flex:1;min-width:0;}
  .grocery-name{font-size:13px;font-weight:600;}
  .grocery-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:Arial,Helvetica,sans-serif;}
  .grocery-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;position:relative;}
  .grocery-check.checked{background:var(--p2);border-color:var(--p2);}
  .grocery-check.checked::after{content:'✓';color:#2B1600;font-size:13px;font-weight:900;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .grocery-row.checked .grocery-name{text-decoration:line-through;color:var(--muted);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:var(--surface);border-radius:22px;padding:26px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal-box table{margin-top:10px;}
  @media (max-width:640px){
    .grid-2{grid-template-columns:1fr;}
  }
</style>
</head>

async function loadStateAsync(){

// --- Gemini AI, routed through a Supabase Edge Function (supabase/functions/gemini-proxy) ---
// Calling Gemini directly from the browser hits CORS rejections on Google's end fairly often
// (their server doesn't reliably allow the custom auth header browsers are required to
// preflight) — routing through your own Edge Function avoids that entirely, since it's a
// server-to-server call from there, and it also keeps your Gemini key off the client
// completely instead of just accepting the exposure as a tradeoff.
// Setup: supabase functions deploy gemini-proxy, then supabase secrets set GEMINI_API_KEY=...
function hasGemini(){
  return hasSharedStorage(); // the proxy lives on the same Supabase project as your data
}
async function callGemini(prompt, opts){
  opts = opts || {};
  if(!hasSharedStorage()) throw new Error('Supabase isn\u2019t configured, so the AI proxy function can\u2019t be reached');
  // Deliberately its own dedicated function (not the shared "gemini-proxy" some other app
  // might use) — that way redeploying or changing anything about TANDEM's AI setup can never
  // affect another app, and vice versa. Each has its own function name and its own key/quota.
  const url = `${window.SUPABASE_URL}/functions/v1/tandem-gemini-proxy`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${window.SUPABASE_ANON_KEY}`,
      'apikey': window.SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ prompt, json: !!opts.json }),
  });
  const data = await res.json().catch(()=>null);
  if(!res.ok || !data){
    const msg = (data && data.error) || `HTTP ${res.status}`;
    throw new Error(`AI request failed: ${msg}`);
  }

  if(!data.text) throw new Error('Gemini returned an empty response');

function isRetryableAIError(message){
  const msg = message||'';

  // seconds — only retry genuinely transient conditions (server overload, short rate limits).
  if(/quota|billing/i.test(msg)) return false;

// Gemini free-tier daily quota always resets at midnight Pacific Time (Google's own docs,
// no exceptions) — this works out when that next reset actually is in the browser's own
// local time, correctly handling US/local daylight saving via Intl rather than a hardcoded offset.
function nextPacificMidnight(){
  const now = new Date();
  const offsetPart = new Intl.DateTimeFormat('en-US', {timeZone:'America/Los_Angeles', timeZoneName:'shortOffset'}).formatToParts(now).find(p=>p.type==='timeZoneName').value;
  const offsetHours = parseInt(offsetPart.replace('GMT',''), 10) || -8; // e.g. "GMT-7" -> -7
  const laDateStr = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Los_Angeles', year:'numeric', month:'2-digit', day:'2-digit'}).format(now);
  const todayMidnightLA_UTC = new Date(`${laDateStr}T00:00:00Z`);
  let resetUTC = new Date(todayMidnightLA_UTC.getTime() - offsetHours*60*60*1000);
  if(resetUTC.getTime() <= now.getTime()) resetUTC = new Date(resetUTC.getTime() + 24*60*60*1000);
  return resetUTC;
}
function formatResetTime(isoString){
  const d = isoString ? new Date(isoString) : nextPacificMidnight();

  const sameDay = d.toDateString()===now.toDateString();
  return d.toLocaleString(undefined, sameDay ? {hour:'numeric', minute:'2-digit'} : {weekday:'short', hour:'numeric', minute:'2-digit'});
}
function friendlyAIError(message){
  const msg = message||'';

    return `Your Gemini quota is used up for today \u2014 resets ${formatResetTime()} your time (that's midnight Pacific, always). Nothing to do but wait, retrying won\u2019t help before then.`;
  }
  if(/503|UNAVAILABLE|high demand|overloaded/i.test(msg)){
    return 'Gemini is overloaded right now and retrying didn\u2019t get through. Worth trying again in a minute or two.';
  }
  return msg; // anything else — the raw message is still the most useful thing to show
}
// Auto-retries when Gemini itself is overloaded (503/high-demand) — not for other errors like
// missing config or a bad key, where retrying the exact same thing would just fail again.
async function callGeminiWithRetry(prompt, opts, onRetryStatus){
  const maxAttempts = 3;
  let lastError;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{
      const result = await callGemini(prompt, opts);
      if(state.aiQuotaExhaustedUntil){ state.aiQuotaExhaustedUntil = null; save(); } // a call succeeded — clear any stale banner
      return result;
    }catch(e){
      lastError = e;
      if(/quota|billing/i.test(e.message||'')){
        // Shared across both of you — this is a project-level quota, not per-person, so whoever
        // hits it first flags it for both (synced via Supabase like everything else).
        state.aiQuotaExhaustedUntil = nextPacificMidnight().toISOString();
        save();
      }
      if(!isRetryableAIError(e.message) || attempt===maxAttempts) throw e;
      const waitMs = attempt * 2500;
      if(onRetryStatus) onRetryStatus(`⏳ Gemini is experiencing high demand — retrying in ${Math.round(waitMs/1000)}s… (attempt ${attempt+1}/${maxAttempts})`);
      await new Promise(r=>setTimeout(r, waitMs));

}

async function callGeminiBullets(prompt, onRetryStatus, opts){

  const fullPrompt = prompt + `\n\nReturn ONLY this exact JSON shape, nothing else, no markdown fences, no text before or after it: {"points": ["first point \u2014 ${sentences} sentences, clear and specific", "second point", "..."]}. Use ${count} points depending on how much there is to say \u2014 keep each point tight and to the point while still covering the genuinely important information. Don't pad with a filler point just to hit a count, and don't sacrifice the key substance for brevity \u2014 just cut the padding around it.`;
  const raw = await callGeminiWithRetry(fullPrompt, {json:true}, onRetryStatus);

function parseBulletPoints(raw){
  let text = (raw||'').trim();
  text = text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  // 1) straightforward parse
  try{
    const parsed = JSON.parse(text);
    if(parsed && Array.isArray(parsed.points) && parsed.points.length) return parsed.points.map(String);
  }catch(e){}
  // 2) model sometimes adds stray text before/after the JSON despite instructions —
  //    pull out just the {...} substring and try again
  const first = text.indexOf('{');
  const last = text.lastIndexOf('}');
  if(first!==-1 && last>first){
    try{
      const parsed = JSON.parse(text.slice(first, last+1));
      if(parsed && Array.isArray(parsed.points) && parsed.points.length) return parsed.points.map(String);
    }catch(e){}
  }
  // 3) last resort — the response clearly isn't the JSON shape we asked for, but there might
  //    still be real, useful content in there (e.g. it answered in a numbered/plain list
  //    instead). Split on blank lines or list-style line starts rather than just failing.
  const fallback = text.split(/\n{2,}|\n(?=[-•*]|\d+[.)])/).map(s=>s.replace(/^[-•*\d.)\s]+/,'').trim()).filter(s=>s.length>15);
  if(fallback.length) return fallback;
  throw new Error('AI returned an unexpected format');
}

function calcBMRAdvanced(personKey){
  const p = state.people[personKey];
  const w=+p.weight, h=+p.height, a=+p.age;
  if(!w||!h||!a) return null;
  const bfEntry = latestBF(personKey);
  let bmr, method;
  if(bfEntry && bfEntry.bfPercent){
    const lbm = w*(1-bfEntry.bfPercent/100);
    bmr = 370 + 21.6*lbm;
    method = 'Katch-McArdle (using your measured body fat %)';
  } else {
    bmr = p.gender==='male' ? (10*w+6.25*h-5*a+5) : (10*w+6.25*h-5*a-161);
    method = 'Mifflin-St Jeor (add a body fat measurement for more precision)';
  }
  const tdee = bmr * ACTIVITY[p.activity].mult;
  return {bmr, tdee, method};
}
function getCyclePhase(personKey){
  const p = state.people[personKey];
  if(!p.cycle || !p.cycle.enabled || !p.cycle.lastPeriodStart) return null;
  const len = +p.cycle.cycleLength || 28;
  const start = new Date(p.cycle.lastPeriodStart+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  let daysSince = Math.floor((today-start)/(1000*60*60*24)) % len;
  if(daysSince < 0) daysSince += len;
  const cycleDay = daysSince + 1;
  let phase, note, calorieBump;
  if(cycleDay <= 5){ phase='Menstrual'; note='Iron and B12 matter more this week — red meat, spinach, legumes. Light cravings are normal.'; calorieBump=0; }
  else if(cycleDay <= 13){ phase='Follicular'; note='Insulin sensitivity is typically highest here — a good window for higher-carb training days and harder sessions.'; calorieBump=0; }
  else if(cycleDay <= 16){ phase='Ovulation'; note='Energy and strength often peak around now.'; calorieBump=0; }
  else { phase='Luteal'; note='Metabolic rate runs a little higher and cravings tend to climb — targets below already include a small calorie/carb bump for this.'; calorieBump=150; }
  return {cycleDay, len, phase, note, calorieBump};
}
function calcTargets(personKey){
  const p = state.people[personKey];
  const cyclePhase = getCyclePhase(personKey);
  const adj = (+p.calorieAdjustment || 0) + (cyclePhase ? cyclePhase.calorieBump : 0);
  let restCalories, protein, fat, bmrInfo=null, usingManual=false;

  const mt = p.manualTargets;
  if(mt && mt.enabled && mt.calories && mt.protein){
    usingManual = true;
    protein = Math.round(+mt.protein);
    fat = Math.round(+mt.fat || 0);
    restCalories = Math.round(+mt.calories) + adj;
    bmrInfo = calcBMRAdvanced(personKey); // optional reference only, may be null if stats incomplete
  } else {
    bmrInfo = calcBMRAdvanced(personKey);
    if(!bmrInfo) return null;
    const phase = PHASES[p.phase];
    const baseAvg = Math.round(bmrInfo.tdee * phase.calMult) + adj;
    protein = Math.round((+p.weight) * phase.proteinPerKg);
    fat = Math.round(baseAvg*0.25/9);
    const n = Math.min(6, Math.max(1, +p.daysPerWeek || 3));
    const trainCalc = Math.round(baseAvg*1.08);
    restCalories = n<7 ? Math.round((7*baseAvg - n*trainCalc)/(7-n)) : baseAvg;
  }

  const proteinCals = protein*4, fatCals = fat*9;
  const carbs = Math.max(0, Math.round((restCalories - proteinCals - fatCals)/4));
  const trainingCals = Math.round(restCalories*1.08);
  const trainingCarbs = Math.max(0, Math.round((trainingCals - proteinCals - fatCals)/4));

  return {
    tdee: bmrInfo ? Math.round(bmrInfo.tdee) : null,
    bmrMethod: usingManual ? (bmrInfo ? `Your own target — for reference, the formula estimates ~${Math.round(bmrInfo.tdee)} kcal TDEE (${bmrInfo.method}).` : 'Your own target (add age/height/weight in Setup to also see a formula estimate).') : bmrInfo.method,
    calories: restCalories, protein, carbs, fat,

}

  const logs = sortedLogs(personKey).filter(l=>l.weight);

  const expectedRate = (+p.weight) * PHASES[p.phase].expectedRatePct;
  const diff = trend.perWeek - expectedRate; // + means losing/gaining slower than intended in the "gain" direction
  if(Math.abs(diff) < 0.12) return null;
  const kcalPerKg = 7700;
  let adjustment = -Math.round((diff * kcalPerKg / 7) / 25) * 25;

function calcNavyBF(gender, neck, waist, hip, height){
  neck=+neck; waist=+waist; hip=+hip; height=+height;
  if(!neck||!waist||!height) return null;
  if(gender==='male'){
    if(waist<=neck) return null;
    return 495/(1.0324 - 0.19077*Math.log10(waist-neck) + 0.15456*Math.log10(height)) - 450;
  } else {
    if(!hip || (waist+hip)<=neck) return null;
    return 495/(1.29579 - 0.35004*Math.log10(waist+hip-neck) + 0.22100*Math.log10(height)) - 450;
  }
}
function latestBF(personKey){
  const arr = state.bodycomp[personKey];
  if(!arr || !arr.length) return null;
  const sorted=[...arr].sort((a,b)=>a.date.localeCompare(b.date));
  return sorted[sorted.length-1];
}

function weeklyTrend(personKey){
  const logs = sortedLogs(personKey).filter(l=>l.weight);
  if(logs.length<2) return null;
  const recent = logs.slice(-14);
  const first = recent[0], last = recent[recent.length-1];
  const days = (new Date(last.date)-new Date(first.date))/(1000*60*60*24);
  if(days<=0) return null;
  const perWeek = (last.weight-first.weight) / (days/7);
  return {perWeek, latestWeight:last.weight};

  if(!trend || !p.goalWeight) return null;
  const remaining = (+p.goalWeight) - trend.latestWeight;
  if(Math.abs(trend.perWeek) < 0.02) return null;
  const weeks = remaining / trend.perWeek;

  const nums = parseRepsNums(repsScheme);
  if(!nums) return null;
  return nums.reduce((a,b)=>a+b,0)/nums.length;
}
function parseRepsTop(repsScheme){
  const nums = parseRepsNums(repsScheme);
  if(!nums) return null;
  return Math.max(...nums);
}
function roundToPlate(weight){ return Math.round(weight/2.5)*2.5; }
function estimateWorkingWeight(personKey, exerciseName, repsScheme){
  const repsAvg = parseRepsAvg(repsScheme);
  if(repsAvg===null) return null; // cardio or unparseable scheme
  const oneRMs = state.oneRepMax[personKey] || {};
  const oneRM = oneRMs[exerciseName];
  if(oneRM){
    const w = (+oneRM) / (1 + repsAvg/30);
    return {weight: roundToPlate(w), source:'1RM'};
  }
  const history = (state.workouts[personKey]||[]).filter(w=>w.exercise===exerciseName).sort((a,b)=>a.date.localeCompare(b.date));
  if(!history.length) return null;
  const last = history[history.length-1];
  const maxWeight = Math.max(...last.sets.map(s=>s.weight));
  const repsTop = parseRepsTop(repsScheme);
  const setsAtTop = last.sets.filter(s=>Math.abs(s.weight-maxWeight)<0.01);
  const readyToProgress = repsTop!==null && setsAtTop.length>0 && setsAtTop.every(s=>s.reps>=repsTop);
  const bigLift = /squat|deadlift|hip thrust|leg press|row|bench|hack/i.test(exerciseName);
  const increment = bigLift ? 5 : 2.5;
  if(!readyToProgress) return {weight: maxWeight, source:'repeat'}; // echo back exactly what was lifted — no need to round
  return {weight: roundToPlate(maxWeight+increment), source:'progression'};
}

function getExerciseTip(name){
  if(EXERCISE_TIPS[name]) return EXERCISE_TIPS[name];
  const n = (name||'').toLowerCase();
  if(/squat|lunge|split squat/.test(n)) return 'Slow, controlled descent (2–3 sec), full depth you can control, drive up through your whole foot.';
  if(/deadlift|rdl|pull-through|hip thrust/.test(n)) return 'Hinge at the hips, keep a flat back, squeeze glutes hard at the top of the movement.';
  if(/press|bench|dip|push-up|push up/.test(n)) return "Slow 2–3 sec lowering phase, brief pause at the stretch, then press with control — don't bounce.";
  if(/row|pull-up|pulldown|pull up/.test(n)) return "Pull with your back, not your arms — squeeze the shoulder blades together at the end range.";
  if(/curl/.test(n)) return 'No swinging — slow eccentric (lowering) phase, full stretch at the bottom.';
  if(/extension|pushdown|kickback/.test(n)) return 'Keep the working joint isolated, control the negative, avoid using momentum.';
  if(/raise/.test(n)) return 'Lead with the working muscle, not momentum — slow and controlled through the full range.';
  if(/crunch|sit-up|plank|ab wheel|core|twist|leg raise|mountain climber|dead bug|v-up|toes to bar/.test(n)) return 'Brace your core hard before moving, control the movement in both directions.';
  if(/calf/.test(n)) return 'Full stretch at the bottom, brief pause, then drive up and squeeze at the top.';
  if(/walking pad|treadmill|bike|row(ing)?|assault/.test(n)) return 'Keep a steady, sustainable pace — you should be able to hold a conversation at this intensity.';
  return 'Control the lowering (eccentric) phase rather than dropping the weight — it keeps tension on the muscle and protects your joints, even if the exact tempo itself isn\u2019t what drives growth.';
}

const PHASE_SCHEME = {
  cut:      {compound:{sets:3,reps:'8–10',rest:90},  accessory:{sets:3,reps:'10–15',rest:60}},
  recomp:   {compound:{sets:4,reps:'6–10',rest:120}, accessory:{sets:3,reps:'10–12',rest:75}},
  leanBulk: {compound:{sets:4,reps:'6–10',rest:120}, accessory:{sets:4,reps:'10–15',rest:60}},
};
function generateSession(sessionType, occurrenceIndex, person, globalIndex, totalSessions){
  const exp = person.experience || 'beginner';
  const groups = SESSION_MUSCLE_GROUPS[sessionType] || SESSION_MUSCLE_GROUPS['Full Body'];
  const count = TRAINING_EXP[exp].exercisesPerSession;
  const picked = [];
  let gi = 0;
  while(picked.length < count){
    const group = groups[gi % groups.length];
    const pool = EXERCISE_POOL[group][exp];
    const usedInGroup = picked.filter(e=>e.group===group).length;
    const idx = (usedInGroup + occurrenceIndex) % pool.length;
    let name = pool[idx];
    if(picked.find(e=>e.name===name)) name = pool[(idx+1)%pool.length];
    picked.push({group, name});
    gi++;
  }
  const scheme = PHASE_SCHEME[person.phase] || PHASE_SCHEME.recomp;
  const strength = picked.map((e,i)=>{
    const role = i<2 ? 'compound' : 'accessory';
    const s = scheme[role];
    return {name:e.name, group:e.group, sets:s.sets, reps:s.reps, restSec:s.rest};
  });
  const cardioType = pickCardioType(globalIndex||0, totalSessions||1);
  const presc = CARDIO_PRESCRIPTIONS[cardioType][person.phase] || CARDIO_PRESCRIPTIONS[cardioType].recomp;
  strength.push({name:presc.name, group:'cardio', sets:1, reps:presc.duration, restSec:0, detail:presc.detail, icon:presc.icon});
  return strength;
}
function getWeeklySplit(personKey){
  const person = state.people[personKey];
  const days = Math.min(6, Math.max(3, +person.daysPerWeek || 3));
  const template = SPLIT_MAP[days] || SPLIT_MAP[3];
  const counts = {};
  return template.map((type, globalIndex)=>{
    counts[type] = (counts[type]||0) + 1;
    const repeats = template.filter(t=>t===type).length;
    const letter = repeats>1 ? ' ' + String.fromCharCode(64+counts[type]) : '';
    const label = type + letter;
    const exercises = generateSession(type, counts[type]-1, person, globalIndex, template.length);
    return {id: (type+'-'+counts[type]).replace(/\s/g,''), type, label, exercises};
  });
}

  } else {
    const wk = state.schedule[personKey][weekStart];
    DAY_LABELS.forEach(d=>{
      const v = wk[d];
      if(v===null || v===undefined || typeof v==='string'){
        wk[d] = {session: v||null, working:false, shiftStart:'', shiftEnd:'', trainTime:'', completed:false, activity:null, activityOther:'', activityDuration:null};
      } else {
        wk[d] = {session: v.session!==undefined?v.session:null, working:!!v.working, shiftStart:v.shiftStart||'', shiftEnd:v.shiftEnd||'', trainTime:v.trainTime||'', completed:!!v.completed, activity:v.activity||null, activityOther:v.activityOther||'', activityDuration:v.activityDuration||null};
      }
    });
  }
  return state.schedule[personKey][weekStart];
}
function autoAssignSessions(personKey, schedule){
  const split = getWeeklySplit(personKey);
  const n = split.length;
  if(!n) return;
  const usedIdx = new Set();
  for(let i=0;i<n;i++){
    let idx = Math.round(i*7/n) % 7;
    while(usedIdx.has(idx)) idx = (idx+1)%7;
    usedIdx.add(idx);
    schedule[DAY_LABELS[idx]].session = split[i].id;
  }
}
function regenerateWeekSchedule(personKey, weekStart){
  const schedule = ensureWeekSchedule(personKey, weekStart);
  DAY_LABELS.forEach(d=>{ schedule[d].session = null; });
  autoAssignSessions(personKey, schedule);
  save();
  renderProgram();
}
function resetWeekSchedule(personKey, weekStart){
  if(!confirm('Reset this week completely? This clears session placements, working days and shift times back to a fresh auto-scheduled week.')) return;
  delete state.schedule[personKey][weekStart];
  ensureWeekSchedule(personKey, weekStart); // recreates blank + auto-assigns
  save();
  renderProgram();
}

function mealCategoryFor(slot){ return (slot==='morningSnack'||slot==='afternoonSnack') ? 'snack' : slot; }
function scaleMeal(recipe, targetCalories){
  let multiplier = targetCalories / recipe.calories;
  multiplier = Math.max(0.5, Math.min(2.5, Math.round(multiplier*4)/4)); // nearest 0.25, clamped
  return {
    multiplier,
    calories: Math.round(recipe.calories*multiplier),
    protein: Math.round(recipe.protein*multiplier),
    carbs: Math.round(recipe.carbs*multiplier),
    fat: Math.round(recipe.fat*multiplier),
  };
}
function roundQty(qty, unit){
  if(unit==='g'||unit==='ml') return Math.round(qty/5)*5;
  if(unit==='clove') return Math.max(1, Math.round(qty));
  if(unit===''){ const r = Math.round(qty*2)/2; return r; }
  return Math.round(qty*10)/10;
}
function formatQtyDisplay(qty, unit){
  if((unit==='g' || unit==='ml') && qty>=1000){
    const converted = Math.round((qty/1000)*100)/100; // 2dp, e.g. 1.3kg
    return `${converted}${unit==='g'?'kg':'L'}`;
  }
  return `${qty}${unit}`;
}
function getEffectiveRecipe(baseRecipe){
  const override = state.mealOverrides && state.mealOverrides[baseRecipe.id];
  return override ? {...baseRecipe, ...override} : baseRecipe;
}
function findRecipeBaseCategory(id){
  for(const cat of Object.keys(MEALS)){
    if(MEALS[cat].some(m=>m.id===id)) return {cat, isCustom:false};
  }
  for(const cat of Object.keys(state.customMeals||{})){
    if((state.customMeals[cat]||[]).some(m=>m.id===id)) return {cat, isCustom:true};
  }
  return null;
}
function combinedMeals(slot){
  const cat = mealCategoryFor(slot);
  let list = [...(MEALS[cat]||[]), ...((state.customMeals&&state.customMeals[cat])||[])];
  if(slot==='lunch'){
    // dinner leftovers are a totally normal lunch the next day — offer them too, clearly labelled
    const dinnerItems = [...(MEALS.dinner||[]), ...((state.customMeals&&state.customMeals.dinner)||[])];
    list = [...list, ...dinnerItems.map(m=>({...m, _leftover:true}))];
  }
  const hidden = state.hiddenMeals || [];
  return list.map(getEffectiveRecipe).filter(m=>!hidden.includes(m.id));
}
function findRecipe(slot, id){ return combinedMeals(slot).find(m=>m.id===id); }
function getMealSelections(personKey){
  if(!state.mealSelections[personKey]) state.mealSelections[personKey] = {};
  const sel = state.mealSelections[personKey];
  if(!sel.dayType) sel.dayType = 'training';
  ['breakfast','lunch','dinner','dessert','preworkout','postworkout','morningSnack','afternoonSnack'].forEach(slot=>{ if(!sel[slot]) sel[slot] = combinedMeals(slot)[0].id; });
  return sel;
}

/* =========================================================
   TIME / SHIFT HELPERS
   ========================================================= */
function timeToMinutes(t){ if(!t) return null; const parts=t.split(':'); if(parts.length<2) return null; const h=+parts[0], m=+parts[1]; if(isNaN(h)||isNaN(m)) return null; return h*60+m; }
function minutesToTime(mins){ mins = ((mins%1440)+1440)%1440; const h=Math.floor(mins/60), m=mins%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function suggestTrainingWindow(shiftStart, shiftEnd){
  const s = timeToMinutes(shiftStart), e = timeToMinutes(shiftEnd);
  if(s===null || e===null) return null;
  if(s >= 12*60){
    return `Train this morning — aim to finish by ${minutesToTime(s-45)}, before your ${shiftStart} start.`;
  }
  return `Early shift — train after you finish, from about ${minutesToTime(e+30)} onward.`;
}
function mealTimingForShift(shiftStart, shiftEnd){
  const s = timeToMinutes(shiftStart), e = timeToMinutes(shiftEnd);
  if(s===null || e===null) return null;
  return { before: minutesToTime(s-90), during: minutesToTime(s + Math.round((e-s)/2)), after: minutesToTime(e+30) };
}

/* ---- Ring component (Vora-style circular progress) ---- */
function ringSVG(percent, color, size, strokeWidth, valueText, labelText, valueFontSize){
  const r = (size - strokeWidth) / 2;
  const c = size / 2;
  const circumference = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = circumference * (1 - pct/100);
  return `
    <div class="ring-wrap" style="width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}" style="transform:rotate(-90deg);">
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface-alt)" stroke-width="${strokeWidth}"></circle>
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round"
          stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .4s;"></circle>
      </svg>
      <div class="ring-center">
        <span class="ring-val" style="font-size:${valueFontSize||Math.round(size*0.22)}px;color:var(--text);">${valueText}</span>
        ${labelText?`<span class="ring-lbl">${labelText}</span>`:''}
      </div>
    </div>`;
}

    const allocation = allocationFor(isTrainingDay ? 'training' : 'rest');
    const slots = slotsFor(isTrainingDay);
    const icons = {breakfast:'🍳', morningSnack:'🍎', preworkout:'⚡', lunch:'🥗', afternoonSnack:'🥨', postworkout:'🔋', dinner:'🍽', dessert:'🍫'};
    mealHTML = slots.map(slot=>{
      const recipe = findRecipe(slot, dayPlan[slot]);
      if(!recipe) return '';
      const slotTarget = Math.round(dayCalories * allocation[slot]);
      const scaled = scaleMeal(recipe, slotTarget);
      return `<div class="ex-row"><span class="ex-name">${icons[slot]} ${recipe.name}</span><span class="ex-scheme">${scaled.calories} kcal</span></div>`;

// Self-contained SVG line chart — no external chart library, so it can't break in a
// sandboxed environment. series = [{label, color, dashed:bool, points:[{x:'label', y:number}]}]
function svgLineChart(series, opts){
  opts = opts || {};
  const width = opts.width || 600, height = opts.height || 220;
  const padL = 40, padR = 14, padT = 14, padB = 28;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const allPoints = series.flatMap(s=>s.points);
  if(!allPoints.length) return `<div class="empty-state">Not enough data yet.</div>`;
  const xLabels = series[0].points.map(p=>p.x); // assume all series share the same x-axis
  const n = xLabels.length;
  const allY = allPoints.map(p=>p.y);
  let yMin = Math.min(...allY), yMax = Math.max(...allY);
  if(yMin===yMax){ yMin -= 1; yMax += 1; }
  const yPad = (yMax-yMin)*0.1;
  yMin -= yPad; yMax += yPad;
  const xFor = (i) => n<=1 ? padL+plotW/2 : padL + (i/(n-1))*plotW;
  const yFor = (v) => padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;

  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + f*plotH;
    const val = (yMax - f*(yMax-yMin));
    return `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" stroke="#2A3140" stroke-width="1"/>
      <text x="${padL-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#8890A0">${Math.round(val)}</text>`;
  }).join('');

  const xTickEvery = Math.max(1, Math.ceil(n/5));
  const xLabelsHTML = xLabels.map((lab,i)=> i%xTickEvery===0 || i===n-1 ? `<text x="${xFor(i)}" y="${height-8}" text-anchor="middle" font-size="10" fill="#8890A0">${fmtDate(lab).slice(0,5)}</text>` : '').join('');

  const seriesHTML = series.map(s=>{
    const pts = s.points.map((p,i)=>`${xFor(i)},${yFor(p.y)}`).join(' ');
    const dash = s.dashed ? 'stroke-dasharray="6,4"' : '';
    const areaPath = !s.dashed ? `M${xFor(0)},${padT+plotH} L${s.points.map((p,i)=>`${xFor(i)},${yFor(p.y)}`).join(' L')} L${xFor(n-1)},${padT+plotH} Z` : null;
    const dots = !s.dashed ? s.points.map((p,i)=>`<circle cx="${xFor(i)}" cy="${yFor(p.y)}" r="3" fill="${s.color}"/>`).join('') : '';
    return `${areaPath?`<path d="${areaPath}" fill="${s.color}22" stroke="none"/>`:''}
      <polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" ${dash} stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}`;
  }).join('');

  const legendHTML = series.length>1 ? `
    <div style="display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
      ${series.map(s=>`<span style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:${s.dashed?'0':'50%'};background:${s.color};display:inline-block;"></span>${s.label}</span>`).join('')}
    </div>` : '';

  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;">${gridLines}${seriesHTML}${xLabelsHTML}</svg>${legendHTML}`;
}

async function aiSuggestVariety(){

function renderMealPickerResults(weekStart, day, slot, dateStr, searchTerm){
  const p = state.people[currentPerson];
  const excluded = p.excludeTags || [];
  const notExcluded = m => !(m.tags && m.tags.some(tag=>excluded.includes(tag)));
  const allOptions = combinedMeals(slot).filter(notExcluded).sort((a,b)=>a.name.localeCompare(b.name));
  const q = (searchTerm||'').trim().toLowerCase();
  let options = allOptions;
  if(q) options = options.filter(m=>m.name.toLowerCase().includes(q));
  const results = document.getElementById('meal-search-results');
  if(!results) return;

  const rowHTML = m => `<div class="sheet-item" style="align-items:center;">
    <span onclick="selectMealForDate('${weekStart}','${day}','${slot}','${m.id}','${dateStr}')" style="display:flex;align-items:center;flex:1;min-width:0;cursor:pointer;">

    </span>

    <span style="cursor:pointer;color:var(--muted);margin-right:8px;flex-shrink:0;" onclick="event.stopPropagation();openEditMealSheet('${slot}','${m.id}')" title="Edit">✎</span>
    <span style="cursor:pointer;color:var(--muted);flex-shrink:0;" onclick="event.stopPropagation();removeMeal('${slot}','${m.id}')" title="Remove">✕</span>
  </div>`;

  let suggestionsHTML = '';
  if(!q){
    const targetCalories = getSlotTargetCalories(currentPerson, weekStart, day, slot);
    const suggested = getSuggestedMeals(slot, currentPerson, targetCalories, allOptions);
    if(suggested.length){
      suggestionsHTML = `
        <p class="hint" style="text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:4px 0 6px 0;">⭐ Suggested for you</p>
        <p class="hint" style="margin-bottom:8px;">${suggestionReason(slot)}</p>
        ${suggested.map(rowHTML).join('')}
        <p class="hint" style="text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:16px 0 6px 0;">All options</p>
      `;
    }
  }

  results.innerHTML = suggestionsHTML + (options.length
    ? options.map(rowHTML).join('')
    : `<div class="empty-state">No matches — try a different search.</div>`);
}
function getSuggestedMeals(slot, personKey, targetCalories, options){
  const list = options || combinedMeals(slot);
  if(!list.length) return [];
  let scored;
  if(slot==='preworkout'){
    // fast-digesting carbs, light on fat — easiest on the stomach close to training
    scored = list.map(m=>({m, score: m.carbs - m.fat*3}));
  } else if(slot==='postworkout'){
    // protein + carbs drive recovery — protein weighted highest
    scored = list.map(m=>({m, score: m.protein*2 + m.carbs*0.6}));
  } else {
    scored = list.map(m=>{
      const scaled = scaleMeal(m, targetCalories || m.calories);
      const closeness = -Math.abs(scaled.multiplier - 1); // prefer portions close to 1x (realistic, not oddly scaled)
      const portableBonus = (state.people[personKey].portableNeeded && m.portable) ? 0.3 : 0;
      return {m, score: closeness + portableBonus};
    });
  }
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,3).map(s=>s.m);
}

  if(slot==='preworkout') return 'Fast carbs, light on fat — easy on your stomach before training';
  if(slot==='postworkout') return 'High protein + carbs to kickstart recovery';
  if(slot==='lunch') return 'Good portion fit for your target — leftovers from dinner included';
  return 'Good portion fit for your target';
}

/* ---- Weekly meal grid (shift-aware) ---- */
function ensureWeekMealPlan(personKey, weekStart){
  const workInfo = ensureWeekSchedule(personKey, weekStart);
  if(!state.mealPlan[personKey]) state.mealPlan[personKey] = {};
  const sel = getMealSelections(personKey);
  const excluded = state.people[personKey].excludeTags || [];
  const allowed = m => !(m.tags && m.tags.some(tag=>excluded.includes(tag)));
  const defaultFor = (d, slot) => {
    const working = workInfo[d] && workInfo[d].working;
    if(working && slot==='breakfast') return (MEALS.breakfast.find(m=>m.portable && allowed(m))||MEALS.breakfast.find(allowed)||MEALS.breakfast[0]).id;
    if(working && slot==='lunch') return (MEALS.lunch.find(m=>m.portable && allowed(m))||MEALS.lunch.find(allowed)||MEALS.lunch[0]).id;
    return sel[slot];
  };
  const slotKeys = ['breakfast','morningSnack','lunch','afternoonSnack','dinner','dessert','preworkout','postworkout'];
  if(!state.mealPlan[personKey][weekStart]){
    state.mealPlan[personKey][weekStart] = DAY_LABELS.reduce((o,d)=>{
      o[d] = {};
      slotKeys.forEach(slot=>{ o[d][slot] = defaultFor(d, slot); });
      return o;
    },{});
  } else {
    // backfill any slot keys that didn't exist yet when this week was first created
    // (e.g. snack slots added after the week was already saved)
    const weekPlan = state.mealPlan[personKey][weekStart];
    DAY_LABELS.forEach(d=>{
      if(!weekPlan[d]) weekPlan[d] = {};
      slotKeys.forEach(slot=>{
        if(weekPlan[d][slot]===undefined) weekPlan[d][slot] = defaultFor(d, slot);
      });
    });
  }
  return state.mealPlan[personKey][weekStart];
}
function computeWeekTotals(personKey, weekStart){
  const workInfo = ensureWeekSchedule(personKey, weekStart);
  const t = calcTargets(personKey);
  const weekPlan = ensureWeekMealPlan(personKey, weekStart);
  let total = {calories:0, protein:0, carbs:0, fat:0};
  if(!t) return {weekTotal:total, dailyAvg:total};
  DAY_LABELS.forEach(day=>{
    const info = workInfo[day] || {};
    const isTrainingDay = !!info.session;
    const dayCalories = (isTrainingDay ? t.trainingCals : t.restCals) + getActivityCalorieBonus(personKey, weekStart, day);
    const allocation = allocationFor(isTrainingDay?'training':'rest');
    const slots = slotsFor(isTrainingDay);
    slots.forEach(slot=>{
      const recipe = findRecipe(slot, weekPlan[day][slot]);
      if(!recipe) return;
      const slotTarget = Math.round(dayCalories*allocation[slot]);
      const scaled = scaleMeal(recipe, slotTarget);
      total.calories+=scaled.calories; total.protein+=scaled.protein; total.carbs+=scaled.carbs; total.fat+=scaled.fat;
    });
  });
  return {
    weekTotal: total,
    dailyAvg: {calories:Math.round(total.calories/7), protein:Math.round(total.protein/7), carbs:Math.round(total.carbs/7), fat:Math.round(total.fat/7)},
  };
}
function renderMealWeekView(){
  const weekStart = getMondayOfWeek(new Date());
  const workInfo = ensureWeekSchedule(currentPerson, weekStart);
  const t = calcTargets(currentPerson);
  const weekPlan = ensureWeekMealPlan(currentPerson, weekStart);
  const excludedTags = state.people[currentPerson].excludeTags || [];
  const mealAllowed = m => !(m.tags && m.tags.some(tag=>excludedTags.includes(tag)));
  const gridHTML = `<div class="week-grid">${DAY_LABELS.map((day,dayIdx)=>{
      const dateStrForDay = addDaysStr(weekStart, dayIdx);
      const info = workInfo[day] || {working:false};
      const isTrainingDay = !!info.session;
      const activityBonus = getActivityCalorieBonus(currentPerson, weekStart, day);
      const dayCalories = (isTrainingDay ? t.trainingCals : t.restCals) + activityBonus;
      const allocation = allocationFor(isTrainingDay ? 'training' : 'rest');
      const shiftTiming = info.working ? mealTimingForShift(info.shiftStart, info.shiftEnd) : null;
      const trainMin = timeToMinutes(info.trainTime);
      const preTime = trainMin!==null ? minutesToTime(trainMin-45) : null;
      const postTime = trainMin!==null ? minutesToTime(trainMin+75) : null;
      const slots = slotsFor(isTrainingDay);
      let dayTotal = {calories:0, protein:0, carbs:0, fat:0};
      const slotsHTML = slots.map(slot=>{
          const recipe = findRecipe(slot, weekPlan[day][slot]);
          const slotTarget = Math.round(dayCalories * allocation[slot]);
          const scaled = recipe ? scaleMeal(recipe, slotTarget) : null;
          if(scaled){ dayTotal.calories+=scaled.calories; dayTotal.protein+=scaled.protein; dayTotal.carbs+=scaled.carbs; dayTotal.fat+=scaled.fat; }
          let timeLabel = '';
          if(slot==='preworkout') timeLabel = preTime ? ` · ~${preTime}` : '';
          else if(slot==='postworkout') timeLabel = postTime ? ` · ~${postTime}` : '';
          else if(shiftTiming) timeLabel = slot==='breakfast'?` · ~${shiftTiming.before}`:slot==='lunch'?` · ~${shiftTiming.during}`:slot==='dinner'?` · ~${shiftTiming.after}`:'';
          return `
          <label style="margin-top:8px;">${slot}${timeLabel}</label>
          <div class="meal-item-row" style="padding:8px 10px;margin-top:2px;" onclick="openMealPickerSheet('${weekStart}','${day}','${slot}','${dateStrForDay}')">
            <span class="meal-item-icon" style="font-size:16px;">${recipe?recipeEmoji(recipe):'❔'}</span>
            <span class="meal-item-info">
              <span class="meal-item-name" style="font-size:12px;">${recipe?recipe.name:'Tap to choose'}</span>
              ${scaled?`<span class="meal-item-sub">${scaled.calories} kcal</span>`:''}
            </span>
            <span class="meal-item-more">⋯</span>
          </div>
        `;}).join('');
      return `
      <div class="day-col">
        <div class="day-name">${day} ${info.working?'<span class="badge home">🥡 shift</span>':''} ${isTrainingDay?'<span class="badge pr">train</span>':''}</div>
        ${info.working && info.shiftStart && info.shiftEnd ? `<p class="hint">${info.shiftStart}–${info.shiftEnd}</p>` : ''}
        ${isTrainingDay && info.trainTime ? `<p class="hint">Train ~${info.trainTime}</p>` : ''}
        ${slotsHTML}
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
          <p class="mono" style="font-size:14px;font-weight:700;margin:0;">${dayTotal.calories} kcal</p>
          <p class="hint" style="margin:2px 0 0 0;">P ${dayTotal.protein}g · C ${dayTotal.carbs}g · F ${dayTotal.fat}g</p>
        </div>
      </div>`;
    }).join('')}
  </div>`;
  const wt = computeWeekTotals(currentPerson, weekStart);
  document.getElementById('mealprep-body').innerHTML = `
    <div class="card">
      <h3>This week's meal prep</h3>
      <p class="hint">Assign meals to each day. Mark shift days and training times in the Program tab and this grid will show your eating windows and lean toward portable options automatically.</p>
      <div class="btn-row"><button class="secondary small" onclick="applyPlanToWeek()">⚡ Use today's picks for the whole week</button></div>
      ${gridHTML}
      <div class="progress-summary" style="margin-top:16px;">
        <div class="progress-chip">Weekly total: <strong>${wt.weekTotal.calories}</strong> kcal</div>
        <div class="progress-chip">Daily avg: <strong>${wt.dailyAvg.calories}</strong> kcal · P ${wt.dailyAvg.protein}g · C ${wt.dailyAvg.carbs}g · F ${wt.dailyAvg.fat}g</div>
      </div>
      <div class="btn-row"><button onclick="generateShoppingList()">🛒 Generate shopping list</button></div>
      <div id="shopping-list-output"></div>
    </div>`;
}
function assignWeekMeal(weekStart, day, slot, value){
  state.mealPlan[currentPerson][weekStart][day][slot] = value;
  save();
  renderMealWeekView();
}
function applyPlanToWeek(){
  const dateStr = mealPrepDate || todayStr();
  const {weekStart, label} = dateToWeekAndDay(dateStr);

/* ---- Grocery checklist (categorized, like a shopping-list app) ---- */
const GROCERY_CATEGORIES = [
  {name:'Protein', icon:'🥩', test:/chicken|beef|turkey|salmon|prawn|pork|cod|steak|mince|egg(?!plant)|tuna/i},
  {name:'Dairy', icon:'🧀', test:/yogurt|yoghurt|milk|cheese|feta|parmesan|cottage/i},
  {name:'Carbs & Grains', icon:'🍚', test:/rice|pasta|oats|bread|noodle|quinoa|wrap|potato|granola|rice cake/i},
  {name:'Produce', icon:'🥦', test:/broccoli|spinach|tomato|cucumber|capsicum|zucchini|berry|berries|banana|apple|grape|watermelon|lemon|garlic|onion|lettuce|veg|salad|greens|pineapple/i},
];
function categorizeIngredient(name){
  const cat = GROCERY_CATEGORIES.find(c=>c.test.test(name));
  return cat || {name:'Pantry & Other', icon:'🧂'};
}
function getShoppingChecked(personKey, weekStart){
  if(!state.shoppingChecked[personKey]) state.shoppingChecked[personKey] = {};
  if(!state.shoppingChecked[personKey][weekStart]) state.shoppingChecked[personKey][weekStart] = {};
  return state.shoppingChecked[personKey][weekStart];
}
function toggleGroceryItem(weekStart, itemKey){
  const checked = getShoppingChecked(currentPerson, weekStart);
  checked[itemKey] = !checked[itemKey];
  save();
  generateShoppingList();
}
let groceryCollapsed = {};
function toggleGroceryCategory(cat){
  groceryCollapsed[cat] = !groceryCollapsed[cat];
  generateShoppingList();
}
function generateShoppingList(){
  const weekStart = getMondayOfWeek(new Date());
  const weekPlan = (state.mealPlan[currentPerson] && state.mealPlan[currentPerson][weekStart]) || {};
  const workInfo = ensureWeekSchedule(currentPerson, weekStart);
  const t = calcTargets(currentPerson);
  const ingredientSet = {};
  Object.entries(weekPlan).forEach(([day,slots])=>{
    const info = workInfo[day] || {};
    const isTrainingDay = !!info.session;
    const dayCalories = (isTrainingDay ? t.trainingCals : t.restCals) + getActivityCalorieBonus(currentPerson, weekStart, day);
    const allocation = allocationFor(isTrainingDay ? 'training' : 'rest');
    Object.entries(slots).forEach(([slot,mealId])=>{
      const recipe = findRecipe(slot, mealId);
      if(!recipe) return;
      const slotTarget = Math.round(dayCalories * (allocation[slot]||0));
      if(!slotTarget) return;
      const scaled = scaleMeal(recipe, slotTarget);
      recipe.ingredients.forEach(ing=>{
        if(ing.qty===null || ing.qty===undefined){
          const key = ing.item + '|note-only';
          ingredientSet[key] = (ingredientSet[key]||0) + 1;
          return;
        }
        const key = ing.item + '|' + ing.unit;
        ingredientSet[key] = (ingredientSet[key]||0) + ing.qty*scaled.multiplier;
      });
    });
  });
  const rows = Object.entries(ingredientSet).map(([key,qty])=>{
    const [item,unit] = key.split('|');
    if(unit==='note-only') return {item, qty:'as needed', unit:''};
    return {item, qty: roundQty(qty, unit), unit};
  }).sort((a,b)=>a.item.localeCompare(b.item));

  const byCategory = {};
  rows.forEach(r=>{
    const cat = categorizeIngredient(r.item);
    if(!byCategory[cat.name]) byCategory[cat.name] = {icon:cat.icon, items:[]};
    byCategory[cat.name].items.push(r);
  });
  const checked = getShoppingChecked(currentPerson, weekStart);
  const catOrder = [...GROCERY_CATEGORIES.map(c=>c.name), 'Pantry & Other'];
  const catsHTML = catOrder.filter(name=>byCategory[name]).map(name=>{
    const cat = byCategory[name];
    const collapsed = !!groceryCollapsed[name];
    return `
      <div class="grocery-cat-header" onclick="toggleGroceryCategory('${name}')">
        <span>${cat.icon} ${name}</span><span>${collapsed?'▾':'▴'}</span>
      </div>
      ${!collapsed ? cat.items.map(r=>{
        const itemKey = r.item;
        const isChecked = !!checked[itemKey];
        return `
        <div class="grocery-row ${isChecked?'checked':''}">
          <div class="grocery-check ${isChecked?'checked':''}" onclick="toggleGroceryItem('${weekStart}','${itemKey.replace(/'/g,"\\'")}')"></div>
          <div class="grocery-icon">${recipeEmoji({name:r.item})}</div>
          <div class="grocery-info">
            <div class="grocery-name">${r.item}</div>
            <div class="grocery-sub">${formatQtyDisplay(r.qty, r.unit)}</div>
          </div>
        </div>`;
      }).join('') : ''}
    `;
  }).join('');

  const html = `
    <div class="card" style="margin-top:16px;">
      <h3>🛒 Shopping list — week of ${fmtDate(weekStart)}</h3>
      <p class="hint">Quantities are totalled across the week at each meal's actual scaled portion size. Tap to check off as you shop.</p>
      ${catsHTML || '<div class="empty-state">Nothing planned this week yet.</div>'}
    </div>`;
  document.getElementById('shopping-list-output').innerHTML = html;
}

/* =========================================================
   RENDER: DAILY LOG
   ========================================================= */
let lastDailySummary = {p1:null, p2:null}; // per-person — a shared global here was the bug
function generateDailySummary(personKey, date){
  const p = state.people[personKey];
  const t = calcTargets(personKey);
  const entry = state.logs[personKey].find(l=>l.date===date);
  if(!entry || !t) return null;
  const {weekStart, label} = dateToWeekAndDay(date);
  const schedule = ensureWeekSchedule(personKey, weekStart);
  const info = schedule[label];
  const isTrainingDay = !!info.session;
  const activityBonus = getActivityCalorieBonus(personKey, weekStart, label);
  const dayTarget = (isTrainingDay ? t.trainingCals : t.restCals) + activityBonus;

  const tips = [];
  let calPct = null;
  let calWasLow = false, calWasHigh = false, proteinWasLow = false;
  if(entry.calories!=null){
    calPct = Math.round(entry.calories/dayTarget*100);
    if(calPct < 85){ calWasLow = true; tips.push(`You came in noticeably under target today (${entry.calories} of ${dayTarget} kcal, about ${calPct}%). Eating too little too often can slow your metabolism down over time and makes it more likely you lose muscle along with fat — if this wasn't planned, an extra snack tomorrow smooths things out better than eating even less to "make up for it."`); }
    else if(calPct > 115){ calWasHigh = true; tips.push(`You came in a fair bit over target today (${entry.calories} of ${dayTarget} kcal, about ${calPct}%). One day over target barely moves the needle by itself — weight change is driven by your average over 1–2 weeks, not any single day, so there's no need to skip meals tomorrow to compensate.`); }
    else tips.push(`You landed close to today's ${dayTarget} kcal target (${calPct}%) — unglamorous, but this kind of consistent day is exactly what adds up to real progress over a few weeks.`);
  }
  if(entry.protein!=null && t.protein){
    const proteinPct = Math.round(entry.protein/t.protein*100);

    else tips.push(`Protein target hit (${entry.protein}g of ${t.protein}g, ${proteinPct}%) — this is the single number that matters most for holding onto or building muscle while your calories are ${p.phase==='cut'?'in a deficit':p.phase==='leanBulk'?'in a surplus':'being managed'}.`);
  }
  if(entry.carbs!=null && t.carbs){
    tips.push(`Carbs: ${entry.carbs}g of ${t.carbs}g. Carbs are your body's preferred fuel for training — not something to fear, they're what lets you lift heavier and recover faster, which is why training days are given more of them than rest days.`);
  }
  if(activityBonus>0){
    const activityDef = getActivityDef(info.activity);
    tips.push(`Today's target already includes an extra +${activityBonus} kcal for ${activityDef?activityDef.label.toLowerCase():'your activity'} — a rough estimate of what it burned, already folded into the number above.`);
  }

  let weightNote = null;
  const logs = sortedLogs(personKey).filter(l=>l.weight);
  if(logs.length>=2){
    const trend = weeklyTrend(personKey);
    if(trend){
      const dir = trend.perWeek>0.05 ? 'gaining' : trend.perWeek<-0.05 ? 'losing' : 'holding steady at';
      weightNote = `Your weekly trend is ${trend.perWeek>0?'+':''}${fmt1(trend.perWeek)} kg/week — you're ${dir} weight right now. This uses your recent weigh-ins rather than just today's number, since weight naturally bounces around day to day from water, food volume and sodium — the trend line is what actually reflects fat loss or muscle gain.`;
    }
  } else {
    weightNote = `Log a weigh-in a few more days this week and a trend line will show up here — that's far more useful than any single day's number, since weight naturally fluctuates.`;
  }

  const workoutMissed = isTrainingDay && !entry.workoutDone;
  let workoutNote = null;
  if(workoutMissed){
    workoutNote = `Today was scheduled as a training day. If you haven't trained yet, the Workout Log is ready whenever you get to it — and if today ended up a rest day instead, that's fine too, just factor it into your weekly total.`;
  } else if(entry.workoutDone){
    workoutNote = `You got the session in today — that's the stimulus that tells your body to hold onto or build muscle. The food you log is what actually supplies the repair afterward.`;
  }

  // Looking ahead to tomorrow, rather than repeating today's meal plan
  const tomorrowDate = addDaysStr(date, 1);
  const {weekStart: twStart, label: twLabel} = dateToWeekAndDay(tomorrowDate);
  const twInfo = ensureWeekSchedule(personKey, twStart)[twLabel];
  const isTomorrowTraining = !!twInfo.session;
  const tomorrowActivityBonus = getActivityCalorieBonus(personKey, twStart, twLabel);
  const tomorrowTarget = (isTomorrowTraining ? t.trainingCals : t.restCals) + tomorrowActivityBonus;

  const lookback = [];
  if(calWasLow) lookback.push('came in under on calories');
  if(calWasHigh) lookback.push('ran a bit over on calories');
  if(proteinWasLow) lookback.push('fell short on protein');
  if(workoutMissed) lookback.push("didn't log today's training");
  const couldveBeenBetter = lookback.length
    ? `The main thing worth tightening up: you ${lookback.join(' and ')}. Nothing to stress over — just something to aim closer to tomorrow.`
    : `Nothing really to flag — today was a solid, on-target day. Keep doing what you did.`;

  const tomorrowNotes = [];
  tomorrowNotes.push(`Tomorrow's a ${isTomorrowTraining?'training':'rest'} day, target ${tomorrowTarget} kcal${isTomorrowTraining?' (cycled up a bit to fuel training)':''}.`);
  if(twInfo.working) tomorrowNotes.push(`It's a shift day for you — worth having something portable sorted in advance.`);
  if(twInfo.activity){
    const ad = getActivityDef(twInfo.activity);
    tomorrowNotes.push(`You've also got ${ad ? (ad.id==='other'?(twInfo.activityOther||'an activity'):ad.label) : 'an activity'} planned — that's already factored into tomorrow's calorie target.`);
  }
  const tomorrowCycle = getCyclePhase(personKey);
  if(tomorrowCycle && tomorrowCycle.phase==='Luteal'){
    tomorrowNotes.push(`Still in your luteal phase — cravings can run a bit higher, that's normal and already accounted for in the target.`);
  }

  return {date, dayTarget, calPct, tips, weightNote, workoutNote, entry, couldveBeenBetter, tomorrowNotes};
}

function substituteExercise(originalName, newName){
  if(newName) sessionExerciseSwaps[originalName] = newName;
  else delete sessionExerciseSwaps[originalName];
  closeExerciseSwapSheet();

}
function saveFullSession(){
  if(!sessionLogSelection){ alert('Pick a session first.'); return; }
  const date = document.getElementById('session-date').value || todayStr();
  const sessions = getSessionOptionsForPerson(currentPerson, date);
  const session = sessions.find(s=>s.id===sessionLogSelection);
  if(!session) return;
  let loggedAny = false;
  Object.entries(sessionLogSets).forEach(([originalName, sets])=>{
    const loggedName = getDisplayExerciseName(originalName); // log under the substitute if one was chosen
    if(isCardioLog(loggedName)){
      const entry = sets[0] || {};
      const duration = parseFloat(entry.duration);
      const distance = parseFloat(entry.distance);
      if(isNaN(duration) && isNaN(distance)) return;
      state.workouts[currentPerson].push({id:uid(), date, exercise:loggedName, cardio:true, duration: isNaN(duration)?null:duration, distance: isNaN(distance)?null:distance});
      loggedAny = true;
      return;
    }
    const validSets = sets.filter(s=>s.weight!=='' && s.weight!=null && s.reps!=='' && s.reps!=null).map(s=>({weight:+s.weight, reps:+s.reps}));
    if(!validSets.length) return;
    state.workouts[currentPerson].push({id:uid(), date, exercise:loggedName, sets:validSets});
    loggedAny = true;
  });
  if(!loggedAny){ alert('Add at least one value to log.'); return; }
  const feeling = sessionFeeling[currentPerson];
  const notes = sessionNotesText[currentPerson];
  const feedbackPersonKey = currentPerson;
  if(feeling){
    state.sessionFeedback[currentPerson].push({id:uid(), date, sessionLabel:session.label, feeling, notes});
    // Show the reliable canned insight immediately, then upgrade it to an AI-personalised
    // one (which actually responds to what they wrote in notes) once it arrives — if the
    // call fails, the canned version just stays as-is and the error shows underneath it.
    lastSessionInsight[currentPerson] = {sessionLabel:session.label, feeling, notes, text:generateSessionInsight(feeling), aiLoading:true};
    fetchAISessionInsight(feedbackPersonKey, date, session.label, feeling, notes);
  } else {
    lastSessionInsight[currentPerson] = null;
  }
  save();
  sessionLogSelection = null;
  sessionLogSets = {};
  sessionExerciseSwaps = {};
  sessionFeeling[currentPerson] = null;
  sessionNotesText[currentPerson] = '';
  renderWorkouts();
}

function getSessionsWithExercises(personKey){
  const person = state.people[personKey];
  const split = getWeeklySplit(personKey);
  const home = homeWorkoutPlan(person);
  const sessions = split.map(s=>({id:s.id, label:s.label, exercises:s.exercises.filter(e=>e.group!=='cardio')}));
  sessions.push({id:'home', label:'🏠 Home Workout', exercises: home});
  return sessions;
}
function findLoggedNameForSlot(personKey, exerciseName){
  // Returns whichever of the original exercise or one of its logged substitutes has history —
  // preferring whichever was logged most recently. Returns null if neither has ever been logged.
  const candidates = [exerciseName, ...getExerciseSubstitutes(exerciseName)];
  let best = null, bestDate = null;
  candidates.forEach(name=>{
    const hist = state.workouts[personKey].filter(w=>w.exercise===name);
    if(hist.length){
      const lastDate = hist.reduce((max,w)=> w.date>max ? w.date : max, hist[0].date);
      if(!bestDate || lastDate>bestDate){ bestDate = lastDate; best = name; }
    }
  });
  return best;
}
let workoutProgressionFilter = {p1:null, p2:null};
function setWorkoutProgressionFilter(val){ workoutProgressionFilter[currentPerson] = val; renderWorkouts(); }
function getNextTargetsSummaryText(personKey){
  const sessions = getSessionsWithExercises(personKey);
  const activeSession = sessionLogSelection ? sessions.find(s=>s.id===sessionLogSelection) : null;
  const sessionsToShow = activeSession ? [activeSession] : [];
  const lines = [];
  sessionsToShow.forEach(s=>{
    s.exercises.forEach(e=>{
      const loggedName = findLoggedNameForSlot(personKey, e.name);
      if(!loggedName) return;
      const suggestion = estimateWorkingWeight(personKey, loggedName, e.reps);
      if(suggestion) lines.push(`${loggedName} (${s.label}): aim for ${suggestion.weight}kg × ${e.reps}`);
    });
  });
  return lines;
}
async function aiExplainNextTargets(){
  const statusEl = document.getElementById('ai-targets-note');
  if(!statusEl) return;
  const p = state.people[currentPerson];
  const lines = getNextTargetsSummaryText(currentPerson);
  if(!lines.length){ statusEl.textContent = 'Log a few sessions first so there\u2019s something to give tips on.'; return; }
  statusEl.innerHTML = '✨ Thinking…';
  const prompt = `You are a supportive, knowledgeable strength coach. Here are ${p.name}'s upcoming targets, calculated from their own logged history:
${lines.join('\n')}

Give practical coaching on this set of targets as a whole: how to sequence effort across the session, realistic expectations for progression at this stage, and a concrete cue for the top sets. Ground this in real strength-training principles, but don't invent citations or numbers you're not confident about. Don't just restate the numbers back.`;
  try{
    const points = await callGeminiBullets(prompt, (msg)=>{ statusEl.innerHTML = msg; });
    statusEl.innerHTML = renderBulletPoints(points);
  }catch(e){
    console.error(e);
    statusEl.innerHTML = `⚠ ${friendlyAIError(e.message)} The targets above are calculated directly from your logged history either way.`;
  }
}
function renderNextTargetsHTML(personKey){
  const sessions = getSessionsWithExercises(personKey);
  const activeSession = sessionLogSelection ? sessions.find(s=>s.id===sessionLogSelection) : null;

  const rowFor = (originalName, repsScheme) => {
    const loggedName = findLoggedNameForSlot(personKey, originalName);
    if(!loggedName) return ''; // never logged (original or a substitute) — skip entirely, no placeholder
    const suggestion = estimateWorkingWeight(personKey, loggedName, repsScheme);
    const history = state.workouts[personKey].filter(w=>w.exercise===loggedName).sort((a,b)=>a.date.localeCompare(b.date));
    const lastLogged = history[history.length-1];
    const bestE1RM = Math.max(...history.flatMap(w=>w.sets.map(s=>e1RM(s.weight,s.reps))));
    const lastE1RM = Math.max(...lastLogged.sets.map(s=>e1RM(s.weight,s.reps)));
    const isPR = bestE1RM!=null && lastE1RM >= bestE1RM - 0.001 && history.length>1;
    const isSub = loggedName !== originalName;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);">
      <div>
        <strong style="font-size:13px;">${loggedName}</strong> ${isSub?`<span class="hint">(sub for ${originalName})</span>`:''} ${isPR?'<span class="badge pr">PR ↑</span>':''}
        <div class="hint">Last: ${Math.max(...lastLogged.sets.map(s=>s.weight))}kg on ${fmtDate(lastLogged.date)}</div>
      </div>
      <div style="text-align:right;">
        <div class="hint" style="text-transform:uppercase;letter-spacing:.4px;">Aim for</div>
        <div class="mono" style="font-weight:700;">${suggestion ? `${suggestion.weight}kg × ${repsScheme}` : '—'}</div>
      </div>
    </div>`;
  };

  if(!activeSession){
    return `<div class="empty-state">Pick a session above (in "Log today's session") to see its targets here.</div>`;
  }
  const rows = activeSession.exercises.map(e=>rowFor(e.name, e.reps)).filter(Boolean).join('');
  return `
    <p class="hint" style="text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:2px;">${activeSession.label}</p>
    ${rows || `<div class="empty-state" style="margin-top:6px;">Nothing logged for this session yet.</div>`}
  `;
}

  if(c.trackedCount===0) return `<div class="empty-state">Nothing scheduled yet this week — set it up in the Program tab.</div>`;
  return `<p style="font-size:18px;font-weight:800;margin:0;" class="mono">${c.doneCount}/${c.trackedCount} <span style="font-size:13px;font-weight:600;color:var(--muted);">workouts complete</span></p>`;
}
