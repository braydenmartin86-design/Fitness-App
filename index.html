function saveWorkout(){
  const date = document.getElementById('wo-date').value || todayStr();
  const exercise = document.getElementById('wo-exercise').value.trim();
  if(!exercise){ alert('Enter an exercise name.'); return; }
  if(isCardioLog(exercise)){
    const distance = parseFloat(document.getElementById('wo-distance').value);
    const duration = parseFloat(document.getElementById('wo-duration').value);
    if(isNaN(distance) && isNaN(duration)){ alert('Add a distance or duration.'); return; }
    state.workouts[currentPerson].push({id:uid(), date, exercise, cardio:true, distance: isNaN(distance)?null:distance, duration: isNaN(duration)?null:duration});
  } else {
    const sets = pendingSets.filter(s=>s.weight!=='' && s.reps!=='').map(s=>({weight:+s.weight, reps:+s.reps}));
    if(!sets.length){ alert('Add at least one set.'); return; }
    state.workouts[currentPerson].push({id:uid(), date, exercise, sets});
  }
  save();
  pendingSets=[{weight:'',reps:''}];
  renderWorkouts();
}
function updateWoExerciseMode(name){
  updateExerciseTipDisplay(name);
  const cardio = isCardioLog(name);
  const cardioFields = document.getElementById('wo-cardio-fields');
  const strengthFields = document.getElementById('wo-strength-fields');
  if(cardioFields) cardioFields.style.display = cardio ? 'block' : 'none';
  if(strengthFields) strengthFields.style.display = cardio ? 'none' : 'block';
}
function deleteWorkout(id){ state.workouts[currentPerson] = state.workouts[currentPerson].filter(w=>w.id!==id); save(); renderWorkouts(); }

/* =========================================================
   RENDER: PROGRESS
   ========================================================= */
let progressExercise = {p1:null, p2:null};
let progressCardio = {p1:null, p2:null};
function getWeekCompletion(personKey, weekStart){
  const schedule = ensureWeekSchedule(personKey, weekStart);
  const trackedDays = DAY_LABELS.filter(d=> schedule[d].session || schedule[d].activity);
  const doneDays = trackedDays.filter(d=> schedule[d].completed);
  return {trackedCount:trackedDays.length, doneCount:doneDays.length, complete: trackedDays.length>0 && doneDays.length===trackedDays.length};
}
function countCompletedByType(personKey, weekStart){
  const schedule = ensureWeekSchedule(personKey, weekStart);
  let gym=0, home=0, recreational=0;
  DAY_LABELS.forEach(d=>{
    const info = schedule[d];
    if(!info.completed) return;
    if(info.session && info.session!=='home') gym++;
    else if(info.session==='home') home++;
    if(info.activity) recreational++; // can stack with a session on the same day
  });
  return {gym, home, recreational};
}
function isStreakWorthyWeek(personKey, weekStart){
  // A streak week needs a genuine full training week, not just "whatever was scheduled got done":
  // all N gym sessions, or (N-1) gym + 1 Home Workout, or (N-1) gym + 2 recreational activities
  // (basketball, golf, pilates, etc). N is that person's own days/week target.
  const person = state.people[personKey];
  const N = Math.min(6, Math.max(3, +person.daysPerWeek || 3));
  const {gym, home, recreational} = countCompletedByType(personKey, weekStart);
  if(gym >= N) return true;
  if(gym >= N-1 && home >= 1) return true;
  if(gym >= N-1 && recreational >= 2) return true;
  return false;
}
function computeWeekStreak(personKey){
  // Counts consecutive weeks meeting the streak bar (see isStreakWorthyWeek), most recent first.
  // Includes the current week if it already qualifies; stops at the first week with no
  // schedule data at all (so it doesn't fabricate a streak through weeks never set up).
  let streak = 0;
  let ws = getMondayOfWeek(new Date());
  if(state.schedule[personKey] && state.schedule[personKey][ws]){
    if(isStreakWorthyWeek(personKey, ws)){ streak = 1; ws = addDaysStr(ws, -7); }
    else { ws = addDaysStr(ws, -7); }
  } else {
    return 0;
  }
  while(state.schedule[personKey] && state.schedule[personKey][ws]){
    const schedule = state.schedule[personKey][ws];
    const hasAnything = DAY_LABELS.some(d=>schedule[d] && (schedule[d].session || schedule[d].activity));
    if(!hasAnything) break;
    if(isStreakWorthyWeek(personKey, ws)){ streak++; ws = addDaysStr(ws, -7); }
    else break;
  }
  return streak;
}
function renderProgress(){
  const p = state.people[currentPerson];
  const logs = sortedLogs(currentPerson).filter(l=>l.weight);
  const fc = forecastWeeks(currentPerson);
  const trend = weeklyTrend(currentPerson);

  const exerciseNames = [...new Set((state.workouts[currentPerson]||[]).map(w=>w.exercise))].filter(n=>!isCardioLog(n)).sort();
  const cardioNames = [...new Set((state.workouts[currentPerson]||[]).filter(w=>w.cardio).map(w=>w.exercise))].sort();
  if(!progressCardio[currentPerson] && cardioNames.length) progressCardio[currentPerson] = cardioNames[0];
  const selectedCardio = progressCardio[currentPerson];
  if(!progressExercise[currentPerson] && exerciseNames.length) progressExercise[currentPerson] = exerciseNames[0];
  const selectedExercise = progressExercise[currentPerson];
  const exerciseHistory = selectedExercise ? [...state.workouts[currentPerson]].filter(w=>w.exercise===selectedExercise).sort((a,b)=>a.date.localeCompare(b.date)) : [];

  const thisWeekStart = getMondayOfWeek(new Date());
  const weekRows = [];
  for(let i=0;i<8;i++){
    const ws = addDaysStr(thisWeekStart, -7*i);
    // only show weeks that actually have a schedule (avoid spamming 8 blank auto-created weeks)
    if(!(state.schedule[currentPerson] && state.schedule[currentPerson][ws])) continue;
    const c = getWeekCompletion(currentPerson, ws);
    if(c.trackedCount===0) continue;
    const we = addDaysStr(ws, 6);
    const label = `${fmtDate(ws)} – ${fmtDate(we)}`;
    weekRows.push({label, isThisWeek:i===0, ...c});
  }

  document.getElementById('main').innerHTML = `
    <h1 class="page-title">Progress</h1>
    <p class="page-sub">Weight trend, forecast, progress per exercise, and your weekly training streak.</p>
    ${personToggleHTML(currentPerson,'setProgressPerson')}
    <div class="card">
      <h3>🗓 Weekly completion</h3>
      <p class="hint">Ticks green the moment every scheduled session/activity for that week is marked done in the Program tab.</p>
      ${weekRows.length ? weekRows.map(w=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:13px;">${w.label}${w.isThisWeek?' <span class="hint">(this week)</span>':''}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="hint">${w.doneCount}/${w.trackedCount}</span>
            ${w.complete ? `<span style="color:var(--success);font-size:18px;">✅</span>` : `<span class="cal-week-dot ${w.doneCount>0?'scheduled':''}" style="font-size:10px;">${Math.round(w.doneCount/w.trackedCount*100)}%</span>`}
          </span>
        </div>`).join('') : `<div class="empty-state">Nothing scheduled yet — visit the Program tab to get a week going.</div>`}
    </div>
    <div class="card">
      <h3>Weight over time</h3>
      ${logs.length>=2 ? svgLineChart([
        {label:p.name, color: currentPerson==='p1'?'#33E0C7':'#FFA94D', points: logs.map(l=>({x:l.date, y:l.weight}))},
        ...(p.goalWeight ? [{label:'Goal', color:'#8890A0', dashed:true, points: logs.map(l=>({x:l.date, y:+p.goalWeight}))}] : []),
      ]) : `<div class="empty-state">Log at least 2 weigh-ins to see a chart.</div>`}
    </div>
    <div class="grid-2">
      <div class="card">
        <h3>Trend</h3>
        ${trend ? `<p class="mono" style="font-size:20px;">${trend.perWeek>0?'+':''}${fmt1(trend.perWeek)} kg/week</p><p class="hint">Based on the last 14 logged days.</p>` : `<div class="empty-state">Not enough data yet.</div>`}
      </div>
      <div class="card">
        <h3>Forecast</h3>
        ${!p.goalWeight ? `<div class="empty-state">Set a goal weight in Setup.</div>` :
          fc && fc.arrived ? `<p style="color:var(--success);font-size:14px;">🎯 You've reached your goal weight based on recent trend!</p>` :
          fc ? `<p class="mono" style="font-size:20px;">~${fc.weeks} weeks</p><p class="hint">to reach ${p.goalWeight} kg at the current rate.</p>` :
          `<div class="empty-state">Keep logging to unlock a forecast.</div>`}
      </div>
    </div>
    <div class="card">
      <h3>📅 Monthly Progress Review</h3>
      <p class="hint">A strictly honest look at the last 30 days — weight trend, training consistency, and nutrition adherence — with concrete suggestions if something needs to change.</p>
      <div class="btn-row"><button class="secondary small" onclick="aiMonthlyReview()">✨ Get my honest monthly review</button></div>
      <p class="hint" id="monthly-review-note" style="margin-top:8px;line-height:1.5;"></p>
    </div>
    <div class="card">
      <h3>Progress per exercise</h3>
      ${exerciseNames.length ? `
      <select onchange="setProgressExercise(this.value)">
        ${exerciseNames.map(n=>`<option value="${n}" ${selectedExercise===n?'selected':''}>${n}</option>`).join('')}
      </select>
      ${exerciseHistory.length>=2 ? `<div style="margin-top:14px;">${svgLineChart([
        {label:'Est. 1RM (kg)', color: currentPerson==='p1'?'#33E0C7':'#FFA94D', points: exerciseHistory.map(s=>({x:s.date, y:Math.round(Math.max(...s.sets.map(x=>e1RM(x.weight,x.reps))))}))},
        {label:'Top set weight (kg)', color:'#8890A0', dashed:true, points: exerciseHistory.map(s=>({x:s.date, y:Math.max(...s.sets.map(x=>x.weight))}))},
      ])}</div>` : `<div class="empty-state" style="margin-top:14px;">Log this exercise at least twice to see a trend.</div>`}
      ${exerciseHistory.length ? `<p class="hint" style="margin-top:10px;">Best set each session (weight × reps): ${exerciseHistory.map(s=>`${Math.max(...s.sets.map(x=>x.weight))}kg×${s.sets.find(x=>x.weight===Math.max(...s.sets.map(y=>y.weight))).reps}`).join(' → ')}</p>` : ''}
      ` : `<div class="empty-state">Log a workout in the Workout Log tab to see per-exercise progress here.</div>`}
    </div>
    ${cardioNames.length ? `
    <div class="card">
      <h3>Cardio Progress</h3>
      <select onchange="setProgressCardio(this.value)">
        ${cardioNames.map(n=>`<option value="${n}" ${selectedCardio===n?'selected':''}>${n}</option>`).join('')}
      </select>
      ${(()=>{
        const hist = [...state.workouts[currentPerson]].filter(w=>w.exercise===selectedCardio && w.cardio).sort((a,b)=>a.date.localeCompare(b.date));
        const paceHist = hist.filter(h=>h.distance>0 && h.duration>0).map(h=>({date:h.date, pace: h.duration/h.distance}));
        const accent = currentPerson==='p1' ? '#33E0C7' : '#FFA94D';
        let chartHTML = '';
        if(paceHist.length>=2){
          chartHTML = `<div style="margin-top:14px;">
            <p class="hint">Pace (min/km) — lower is faster/fitter</p>
            ${svgLineChart([{label:'Pace (min/km)', color:accent, points: paceHist.map(p=>({x:p.date, y:Math.round(p.pace*100)/100}))}])}
          </div>`;
        } else if(hist.length<2){
          chartHTML = `<div class="empty-state" style="margin-top:14px;">Log this at least twice (with distance filled in for a pace trend) to see progress.</div>`;
        } else {
          chartHTML = `<p class="hint" style="margin-top:14px;">Add a distance next time you log this for a pace trend — showing recent history below for now.</p>`;
        }
        const recentHTML = hist.slice(-5).reverse().map(h=>{
          const paceStr = (h.distance>0 && h.duration>0) ? ` · ${fmt1(h.duration/h.distance)} min/km` : '';
          return `<p class="hint" style="margin:4px 0;">${fmtDate(h.date)} — ${h.distance?`${h.distance}km`:''}${h.distance&&h.duration?' · ':''}${h.duration?`${h.duration} min`:''}${paceStr}</p>`;
        }).join('');
        return chartHTML + `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">${recentHTML}</div>`;
      })()}
    </div>` : ''}
  `;
}
function getMonthlyReviewData(personKey){
  const p = state.people[personKey];
  const t = calcTargets(personKey);
  const cutoff = addDaysStr(todayStr(), -30);
  const weightLogs = sortedLogs(personKey).filter(l=>l.weight && l.date>=cutoff).sort((a,b)=>a.date.localeCompare(b.date));
  const workoutsInMonth = state.workouts[personKey].filter(w=>w.date>=cutoff && !w.cardio);
  const uniqueWorkoutDays = new Set(workoutsInMonth.map(w=>w.date)).size;
  const expectedSessions = Math.round((+p.daysPerWeek||3) * 30/7);
  const dailyLogsInMonth = state.logs[personKey].filter(l=>l.date>=cutoff);
  const calorieLogs = dailyLogsInMonth.filter(l=>l.calories!=null);
  const onTargetDays = t ? calorieLogs.filter(l=>{
    const pct = l.calories/t.calories*100;
    return pct>=85 && pct<=115;
  }).length : 0;

  let weightSummary = null;
  if(weightLogs.length>=2){
    const first = weightLogs[0], last = weightLogs[weightLogs.length-1];
    const days = Math.max(1, (new Date(last.date)-new Date(first.date))/(1000*60*60*24));
    const totalChange = last.weight - first.weight;
    const perWeek = totalChange/days*7;
    const expectedRate = (+p.weight||last.weight) * (PHASES[p.phase] ? PHASES[p.phase].expectedRatePct : 0);
    weightSummary = {firstWeight:first.weight, lastWeight:last.weight, totalChange, perWeek, expectedRate, days:Math.round(days), logCount:weightLogs.length};
  }

  return {weightSummary, uniqueWorkoutDays, expectedSessions, dailyLogsCount: dailyLogsInMonth.length, calorieLogsCount: calorieLogs.length, onTargetDays, goalWeight: p.goalWeight};
}
async function aiMonthlyReview(){
  const statusEl = document.getElementById('monthly-review-note');
  if(!statusEl) return;
  const p = state.people[currentPerson];
  const d = getMonthlyReviewData(currentPerson);
  statusEl.innerHTML = '✨ Reviewing the last 30 days…';
  const phaseLabel = PHASES[p.phase] ? PHASES[p.phase].label.split(' \u2014 ')[0] : p.phase;
  const prompt = `You are a strict, brutally honest, evidence-based coach doing a monthly review for ${p.name}, who is on a "${phaseLabel}" phase${p.goalWeight?` working toward a goal weight of ${p.goalWeight}kg`:''}. Do not sugarcoat anything — if something isn't working, say so plainly and directly. If something is genuinely working, say that too, backed by the actual numbers below. Be skeptical of thin data and say so if there isn't enough to draw a real conclusion, rather than manufacturing an opinion either way.

Weight over the last ~30 days: ${d.weightSummary ? `went from ${d.weightSummary.firstWeight}kg to ${d.weightSummary.lastWeight}kg over ${d.weightSummary.days} days (${d.weightSummary.totalChange>0?'+':''}${fmt1(d.weightSummary.totalChange)}kg total, averaging ${d.weightSummary.perWeek>0?'+':''}${fmt1(d.weightSummary.perWeek)}kg/week), based on ${d.weightSummary.logCount} weigh-ins. Expected rate for this phase: ${d.weightSummary.expectedRate>0?'+':''}${fmt1(d.weightSummary.expectedRate)}kg/week.` : `Not enough weigh-in data this month to establish a real trend (fewer than 2 weigh-ins logged in the last 30 days) — call this out as a real gap, since without consistent weigh-ins there's no way to actually know if the plan is working.`}

Training consistency: ${d.uniqueWorkoutDays} distinct days with a logged workout in the last 30 days, against roughly ${d.expectedSessions} expected sessions based on a ${p.daysPerWeek} days/week target.

Nutrition logging: ${d.dailyLogsCount} days logged out of the last 30. Of the ${d.calorieLogsCount} days with calories recorded, ${d.onTargetDays} landed within a reasonable range of target (85-115%).

Give a strictly honest, in-depth monthly review covering: whether the weight trend is genuinely on track for their goal (and if not, by how much and what that practically means), whether training consistency is adequate, whether nutrition logging/adherence is a limiting factor holding progress back, and concrete, specific changes for the next month if something needs to change. If everything is genuinely on track, say so clearly rather than inventing a problem to solve.`;
  try{
    const points = await callGeminiBullets(prompt, (msg)=>{ statusEl.innerHTML = msg; });
    statusEl.innerHTML = renderBulletPoints(points);
  }catch(e){
    console.error(e);
    statusEl.innerHTML = `⚠ ${friendlyAIError(e.message)}`;
  }
}
function setProgressPerson(key){ currentPerson=key; renderProgress(); }
function setProgressExercise(name){ progressExercise[currentPerson] = name; renderProgress(); }
function setProgressCardio(name){ progressCardio[currentPerson] = name; renderProgress(); }

/* =========================================================
   ROUTER
   ========================================================= */
function render(){
  renderBottomNav();
  updateSyncIndicator();
  updateAIQuotaBanner();
  if(currentTab==='dashboard') renderDashboard();
  else if(currentTab==='nutrition') renderNutrition();
  else if(currentTab==='program') renderProgram();
  else if(currentTab==='mealprep') renderMealPrep();
  else if(currentTab==='setup') renderSetup();
  else if(currentTab==='log') renderLog();
  else if(currentTab==='bodycomp') renderBodyComp();
  else if(currentTab==='workouts') renderWorkouts();
  else if(currentTab==='progress') renderProgress();
}
async function initApp(){
  document.getElementById('main').innerHTML = `<div class="empty-state" style="margin-top:60px;">Loading${hasSharedStorage()?' — syncing with your partner\u2019s data…':'…'}</div>`;
  state = await loadStateAsync();
  migrateDefaultNames();
  editMode = {p1: !state.people.p1.age, p2: !state.people.p2.age};
  lastSyncedAt = new Date();
  syncStatus = hasSharedStorage() ? 'saved' : 'local';
  render();
  if(hasSharedStorage()){
    // Real-time push: the moment the other phone saves, Supabase notifies us over websocket
    // and we pull the fresh state in immediately — no waiting, no polling.
    setupRealtimeSync();
    // Belt-and-suspenders fallback: also refresh whenever the app regains focus (e.g. switching
    // back from another app), in case the websocket connection dropped for any reason.
    // Deliberately NOT a timer, so it can never interrupt someone mid-edit.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible') refreshFromShared();
    });
  }
}
initApp();

// Register the service worker for offline app-shell caching + installability.
// (Service workers must be their own file, served from the same origin — that's a hard
// browser security rule, not something that can be inlined into this HTML file.)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.error('Service worker registration failed:', err));
  });
}
